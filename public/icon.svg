<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 12"/>

  <!-- Radar Concentric Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#27272a" stroke-width="4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#3f3f46" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#52525b" stroke-width="4"/>

  <!-- Radar Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#ef4444" stroke-width="4" opacity="0.6"/>
  <line x1="46" y1="256" x2="466" y2="256" stroke="#ef4444" stroke-width="4" opacity="0.6"/>

  <!-- Outer Pentagon Bastion -->
  <polygon points="256,70 430,196 364,394 148,394 82,196" fill="#18181b" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner Pentagon Corridor -->
  <polygon points="256,120 380,210 333,354 179,354 132,210" fill="#27272a" stroke="#d97706" stroke-width="8" stroke-linejoin="round"/>

  <!-- Central Strategic Core -->
  <polygon points="256,180 326,231 300,314 212,314 186,231" fill="url(#redGrad)" stroke="#7f1d1d" stroke-width="4" stroke-linejoin="round"/>

  <!-- Glowing Center Beacon -->
  <circle cx="256" cy="256" r="24" fill="#fef08a" filter="drop-shadow(0 0 16px #f59e0b)"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>

  <!-- Corner Tactical Rivets -->
  <circle cx="48" cy="48" r="8" fill="#d97706"/>
  <circle cx="464" cy="48" r="8" fill="#d97706"/>
  <circle cx="48" cy="464" r="8" fill="#d97706"/>
  <circle cx="464" cy="464" r="8" fill="#d97706"/>
</svg>
